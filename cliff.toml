[changelog]
header = ""
body = """
{% set repo = "https://github.com/StefanoCretti/paperthin" -%}
{% for group, commits in commits | group_by(attribute="group") -%}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first | trim }} ([{{ commit.id | truncate(length=7, end="") }}]({{ repo }}/commit/{{ commit.id }}))
{%- endfor %}

{% endfor -%}
{% if previous.version and version -%}
**Full Changelog**: {{ repo }}/compare/{{ previous.version }}...{{ version }}
{% endif -%}
"""
trim = true
postprocessors = [
  { pattern = "<!-- [0-9] -->", replace = "" },
]

[git]
conventional_commits = true
filter_unconventional = false
protect_breaking_commits = true
sort_commits = "oldest"
tag_pattern = "v[0-9]*"

commit_parsers = [
  { message = "^\\w+!", group = "<!-- 0 -->Breaking changes" },
  { message = "^new", group = "<!-- 1 -->Added" },
  { message = "^feat", group = "<!-- 1 -->Added" },
  { message = "^add", group = "<!-- 1 -->Added" },
  { message = "^refactor", group = "<!-- 2 -->Changed" },
  { message = "^change", group = "<!-- 2 -->Changed" },
  { message = "^perf", group = "<!-- 2 -->Changed" },
  { message = "^fix", group = "<!-- 3 -->Fixed" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^ci", group = "<!-- 5 -->Maintenance" },
  { message = "^build", group = "<!-- 5 -->Maintenance" },
  { message = "^chore", group = "<!-- 5 -->Maintenance" },
  { message = "^cleanup", group = "<!-- 5 -->Maintenance" },
  { message = "^test", group = "<!-- 5 -->Maintenance" },
  { message = "^style", group = "<!-- 5 -->Maintenance" },
  { message = "^draft", skip = true },
  { message = "^Initial commit", skip = true },
  { message = ".*", group = "<!-- 6 -->Other" },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = false
custom_minor_increment_regex = "^new"
